# V0rtexOS — Universal Xorg Configuration
# Compatibilidade: QEMU, VBox, VMware, Bare Metal (Intel/AMD/Nvidia),
#                  Raspberry Pi (vc4), ARM64, celulares (fbdev/modesetting)
# Estratégia: modesetting primário (KMS), fbdev fallback, sem VESA forçado

Section "ServerFlags"
    Option "AutoAddDevices"    "true"
    Option "AutoEnableDevices" "true"
    Option "AutoAddGPU"        "true"
    # Sem AllowEmptyInput: garante que o servidor não inicia sem teclado/mouse físico
    # mas aceita dispositivos virtuais (QEMU, VMs)
EndSection

# Driver primário: modesetting (KMS moderno — Bare Metal, QEMU/virtio, ARM/vc4/lima/panfrost)
Section "Device"
    Identifier  "V0rtexPrimary"
    Driver      "modesetting"
    Option      "ShadowFB"     "false"
    Option      "AccelMethod"  "glamor"
EndSection

# Driver fallback: fbdev (VMs sem KMS, ARM sem driver DRM, framebuffers genéricos)
Section "Device"
    Identifier  "V0rtexFallback"
    Driver      "fbdev"
    Option      "ShadowFB"     "true"
EndSection

Section "Screen"
    Identifier   "V0rtexScreen"
    Device       "V0rtexPrimary"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Modes  "1920x1080" "1366x768" "1280x720" "1024x768" "800x600" "640x480"
    EndSubSection
EndSection

Section "Monitor"
    Identifier  "V0rtexMonitor"
    Option      "DPMS" "false"
EndSection

# ── INPUT: teclado ────────────────────────────────────────────────────────────
Section "InputClass"
    Identifier   "V0rtexKeyboard"
    MatchIsKeyboard "on"
    Driver       "libinput"
    Option       "XkbLayout"  "us"
    Option       "XkbOptions" "terminate:ctrl_alt_bksp"
EndSection

# ── INPUT: mouse/touchpad ─────────────────────────────────────────────────────
Section "InputClass"
    Identifier   "V0rtexPointer"
    MatchIsPointer "on"
    Driver       "libinput"
    Option       "AccelProfile" "flat"
EndSection

# ── INPUT: touchpad (laptops) ─────────────────────────────────────────────────
Section "InputClass"
    Identifier   "V0rtexTouchpad"
    MatchIsTouchpad "on"
    Driver       "libinput"
    Option       "Tapping"          "on"
    Option       "TappingDrag"      "on"
    Option       "NaturalScrolling" "on"
EndSection

# ── INPUT: touchscreen (celulares / tablets / RPi touch) ──────────────────────
Section "InputClass"
    Identifier   "V0rtexTouchscreen"
    MatchIsTouchscreen "on"
    Driver       "libinput"
    Option       "CalibrationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection
