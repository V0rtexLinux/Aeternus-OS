# V0rtexOS — Raspberry Pi Xorg Configuration
# Ativo quando o hardware é detectado como RPi (vc4/v3d DRM)
# Driver vc4 usa modesetting moderno com glamor acceleration

# O RPi 4/5 com vc4-kms-v3d usa o driver "modesetting" do Xorg.
# Este arquivo garante que não tentamos drivers incompatíveis.

Section "Device"
    Identifier  "V0rtexRPi"
    Driver      "modesetting"
    # vc4-kms-v3d expõe /dev/dri/card0 via KMS — glamor funciona bem
    Option      "AccelMethod" "glamor"
    Option      "ShadowFB"    "false"
EndSection

Section "Screen"
    Identifier   "V0rtexRPiScreen"
    Device       "V0rtexRPi"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Modes  "1920x1080" "1280x720" "1024x768"
    EndSubSection
EndSection

# Touch Display oficial do Raspberry Pi (DSI)
Section "InputClass"
    Identifier   "RPiTouchDisplay"
    MatchProduct "FT5406"
    Driver       "libinput"
    Option       "TransformationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection
