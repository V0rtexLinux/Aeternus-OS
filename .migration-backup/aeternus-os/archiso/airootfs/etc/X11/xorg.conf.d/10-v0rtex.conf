# V0rtexOS — Universal Xorg Configuration
# Compatibilidade: QEMU, VBox, VMware, Bare Metal (Intel/AMD/Nvidia), Celular
# Drivers: modesetting (primário), fbdev (fallback), libinput (input)

Section "ServerFlags"
    Option "AutoAddDevices"    "true"
    Option "AutoEnableDevices" "true"
    # REMOVIDO: AllowEmptyInput (Evita que o teclado/mouse parem de funcionar se o libinput falhar)
    Option "AutoAddGPU"        "true"
EndSection

# 1. Driver Primário: modesetting (KMS moderno - Bare Metal e VMs com virtio)
Section "Device"
    Identifier  "V0rtexCard"
    Driver      "modesetting"
    # Sem AccelMethod fixo aqui para permitir aceleração de hardware onde ela existir.
    # Se uma VM antiga travar, o Xorg pula automaticamente para o próximo Device (fbdev).
EndSection

# 2. Driver Fallback: fbdev (Garante vídeo mesmo sem KMS ou drivers específicos)
Section "Device"
    Identifier  "V0rtexCardFB"
    Driver      "fbdev"
EndSection

Section "Screen"
    Identifier   "V0rtexScreen"
    Device       "V0rtexCard"  # O Xorg tenta este primeiro; se falhar, tenta os outros definidos
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        # Modelines dinâmicos hoje em dia gerenciam isso, mas mantemos o fallback de segurança
        Modes  "1920x1080" "1280x720" "1024x768" "800x600"
    EndSubSection
EndSection

# --- INPUT UNIVERSAL (libinput) ---

Section "InputClass"
    Identifier "V0rtexPointer"
    MatchIsPointer "on"
    Driver "libinput"
    Option "AccelProfile" "flat"
EndSection

Section "InputClass"
    Identifier "V0rtexKeyboard"
    MatchIsKeyboard "on"
    Driver "libinput"
EndSection

Section "InputClass"
    Identifier "V0rtexTouchscreen"
    MatchIsTouchscreen "on"
    Driver "libinput"
EndSection

Section "InputClass"
    Identifier "V0rtexTouchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on" # Adicionado por conveniência em celulares/laptops
EndSection