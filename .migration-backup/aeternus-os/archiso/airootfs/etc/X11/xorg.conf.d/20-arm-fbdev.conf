# V0rtexOS — ARM/Mobile Xorg Fallback
# Ativado automaticamente em hardware sem driver KMS/DRM (ARM genérico, celulares)
# O Xorg tenta modesetting primeiro (10-v0rtex.conf); se falhar,
# o matchseat vazio abaixo garante que fbdev seja tentado automaticamente.

# Nota: este arquivo NÃO força fbdev globalmente.
# O Xorg usa a ordem dos arquivos *.conf para decidir fallback.
# Mantemos este arquivo separado para facilitar depuração em ARM.

Section "Device"
    Identifier  "V0rtexARM"
    Driver      "fbdev"
    Option      "fbdev"    "/dev/fb0"
    Option      "ShadowFB" "true"
EndSection
